name: pushpilot_flutter_example
description: "Shows how an app integrates the pushpilot_flutter plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Only the example depends on Firebase; the plugin does not.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  pushpilot_flutter:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
