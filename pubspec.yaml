name: pushpilot_flutter
description: "AI-native push notifications, Live Activities and in-app messages for Flutter. PushPilot AI runs engagement on autopilot. First 1,000 devices free, then $1 per 1,000."
version: 2.3.0
homepage: https://pushpilot.ai
repository: https://github.com/pushpilotai/pushpilot-flutter
issue_tracker: https://github.com/pushpilotai/pushpilot-flutter/issues

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.pushpilot.pushpilot_flutter
        pluginClass: PushpilotFlutterPlugin
      ios:
        pluginClass: PushpilotFlutterPlugin
